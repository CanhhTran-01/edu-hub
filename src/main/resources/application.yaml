server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: edu-hub
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DBMS_CONNECTION}
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      # đối với dev cần thêm "- classpath:db/seed" để khởi tạo dữ liệu test local

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS:}
    password: ${GMAIL_APP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # mặc định dev, prod override bằng env var
