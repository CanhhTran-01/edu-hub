server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
  access-token-lifetime: ${JWT_ACCESS_TOKEN_LIFETIME:15m}
  refresh-token-lifetime: ${JWT_REFRESH_TOKEN_LIFETIME:7d}

identity:
  password:
    minimum-length: ${PASSWORD_MINIMUM_LENGTH:8}
    initial-password: ${INITIAL_ACCOUNT_PASSWORD}
  authentication:
    max-failed-logins: ${AUTH_MAX_FAILED_LOGINS:5}
    temporary-lock-duration: ${AUTH_TEMPORARY_LOCK_DURATION:15m}

app:
  init:
    system-admin:
      username: ${APP_INIT_SYSTEM_ADMIN_USERNAME}
      password: ${APP_INIT_SYSTEM_ADMIN_PASSWORD}
      email: ${APP_INIT_SYSTEM_ADMIN_EMAIL:}

spring:
  application:
    name: edu-hub
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${DBMS_CONNECTION}
    username: ${DBMS_USERNAME}
    password: ${DBMS_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      # đối với dev cần thêm "- classpath:db/seed" để khởi tạo dữ liệu test local

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_ADDRESS:}
    password: ${GMAIL_APP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # mặc định dev, prod override bằng env var

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GOOGLE_API_KEY}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
        embedding:
          api-key: ${GOOGLE_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768
    vectorstore:
      pgvector:
        dimensions: 768
        index-type: hnsw
        distance-type: cosine_distance
        initialize-schema: false

admission:
  min-capacity: 40
  max-capacity: 50
  reserve-capacity: 15
  max-import-rows: 50000
  student-code-format: "[MaNganh][SttKhoa][SttLop][SttSVTrongLop]"
  notifications-enabled: true
  mail-retry-delay-ms: 60000

people:
  lecturer-code-format: "[MaKhoa][NamTuyenDung][SttGV]"

notification:
  mail:
    brand-name: ${NOTIFICATION_MAIL_BRAND_NAME:EduHub}
    login-url: ${NOTIFICATION_MAIL_LOGIN_URL:}
    support-email: ${NOTIFICATION_MAIL_SUPPORT_EMAIL:}

eduhub:
  ai:
    rag:
      top-k: 3
      similarity-threshold: 0.70
      memory-message-limit: 20
      chunk-size: 800
      max-file-size: 20MB
      fallback-message: "Tôi không tìm thấy thông tin này trong tài liệu hiện có, vui lòng liên hệ phòng đào tạo."
      system-prompt: |
        Bạn là trợ lý học vụ của KMA Smart Edu.
        Chỉ trả lời dựa trên phần thông tin tham khảo được cung cấp từ tài liệu.
        Không suy đoán và không sử dụng kiến thức bên ngoài.
        Trả lời ngắn gọn, rõ ràng bằng tiếng Việt.
